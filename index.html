<script type="module">

/* =====================================================
   صلاتي AI
   الكاميرا + التعرف على الجسم والحركات
   لا يقرر صحة الصلاة، بل يتعرف على وضعية الجسم فقط
===================================================== */


/* =====================================================
   تحميل MediaPipe Pose Landmarker
===================================================== */

import {
  FilesetResolver,
  PoseLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =====================================================
   العناصر
===================================================== */

const home =
document.getElementById("home");

const learn =
document.getElementById("learn");

const monitor =
document.getElementById("monitor");

const learnBtn =
document.getElementById("learnBtn");

const monitorBtn =
document.getElementById("monitorBtn");

const learnMonitorBtn =
document.getElementById("learnMonitorBtn");

const learnHomeBtn =
document.getElementById("learnHomeBtn");

const homeBtn =
document.getElementById("homeBtn");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const resetBtn =
document.getElementById("resetBtn");

const testBtn =
document.getElementById("testBtn");

const camera =
document.getElementById("camera");

const video =
document.getElementById("video");

const canvas =
document.getElementById("poseCanvas");

const ctx =
canvas.getContext("2d");

const statusBox =
document.getElementById("status");

const poseBox =
document.getElementById("pose");

const alertBox =
document.getElementById("alert");

const sequenceBox =
document.getElementById("sequence");

const rakaaBox =
document.getElementById("rakaa");

const permissionBox =
document.getElementById("permissionBox");


/* =====================================================
   المتغيرات
===================================================== */

let stream = null;

let cameraRunning = false;

let movements = [];

let rakaa = 0;

let animationFrame = null;

let poseLandmarker = null;

let poseLoading = false;

let lastVideoTime = -1;

let lastPoseName = "";

let stablePose = "";

let stableCount = 0;

let lastMovementTime = 0;


/* =====================================================
   إعدادات التعرف
===================================================== */

const MODEL_URL =
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

const WASM_URL =
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm";


/* =====================================================
   أسماء نقاط الجسم في MediaPipe
===================================================== */

const P = {

NOSE: 0,

LEFT_SHOULDER: 11,
RIGHT_SHOULDER: 12,

LEFT_ELBOW: 13,
RIGHT_ELBOW: 14,

LEFT_WRIST: 15,
RIGHT_WRIST: 16,

LEFT_HIP: 23,
RIGHT_HIP: 24,

LEFT_KNEE: 25,
RIGHT_KNEE: 26,

LEFT_ANKLE: 27,
RIGHT_ANKLE: 28,

LEFT_HEEL: 29,
RIGHT_HEEL: 30,

LEFT_FOOT: 31,
RIGHT_FOOT: 32

};


/* =====================================================
   إنشاء نموذج الذكاء الاصطناعي
===================================================== */

async function loadPoseModel(){

if(poseLandmarker){

return true;

}

if(poseLoading){

return false;

}

poseLoading = true;

try{

statusBox.textContent =
"⏳ جاري تحميل نظام التعرف على الجسم...";


const vision =
await FilesetResolver.forVisionTasks(
WASM_URL
);


poseLandmarker =
await PoseLandmarker.createFromOptions(
vision,
{

baseOptions:{
modelAssetPath:MODEL_URL,
delegate:"GPU"
},

runningMode:"VIDEO",

numPoses:1,

minPoseDetectionConfidence:0.45,

minPosePresenceConfidence:0.45,

minTrackingConfidence:0.45

}
);


poseLoading = false;

return true;

}
catch(error){

console.error(
"Pose model error:",
error
);

poseLoading = false;

showAlert(
"❌ لم يتم تحميل نظام التعرف على الجسم. تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.",
"error"
);

statusBox.textContent =
"❌ تعذر تحميل التعرف على الجسم";

return false;

}

}


/* =====================================================
   التنقل
===================================================== */

function showPage(page){

home.classList.add("hidden");

learn.classList.add("hidden");

monitor.classList.add("hidden");

page.classList.remove("hidden");

}


/* الرئيسية → التعلم */

learnBtn.addEventListener(

);


/* الرئيسية → المراقبة */

monitorBtn.addEventListener(

}
);


/* التعلم → المراقبة */

learnMonitorBtn.addEventListener(
"click",

}
);


/* التعلم → الرئيسية */

learnHomeBtn.addEventListener(
"click",
function(){

showPage(home);

}
);

homeBtn.addEventListener(
"click",

showPage(home);

}
);


/* =====================================================
   اختبار التنبيه
===================================================== */

testBtn.addEventListener(
"click",

showAlert(
"⚠️ اختبار التنبيه: راجع وضعية الجسم.",

);

);

}
);


/* =====================================================
   إعادة البداية
===================================================== */

resetBtn.addEventListener(
"click",
function(){

movements = [];

rakaa = 0;

rakaaBox.textContent = "0";

poseBox.textContent = "—";

sequenceBox.textContent =
"لم تبدأ الصلاة";

statusBox.textContent =
cameraRunning
? "🟢 الكاميرا تعمل"
: "🟢 جاهز";

alertBox.classList.add("hidden");

lastPoseName = "";

stablePose = "";

stableCount = 0;

lastMovementTime = 0;

}
);


/* =====================================================
   بدء الكاميرا
===================================================== */

startBtn.addEventListener(
"click",
startCamera
);


async function startCamera(){

if(cameraRunning){

return;

}


if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

showAlert(
"❌ المتصفح لا يدعم تشغيل الكاميرا. افتح الموقع باستخدام Chrome.",
"error"
);

return;

}


try{

startBtn.disabled = true;

statusBox.textContent =
"⏳ جاري طلب إذن الكاميرا...";

permissionBox.classList.remove(
"hidden"
);


/* الكاميرا الأمامية */

stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"user"
},

width:{
ideal:1280,
min:320
},

height:{
ideal:720,
min:240
}
},

audio:false

});


permissionBox.classList.add(
"hidden"
);


/* ربط الفيديو */

video.srcObject =
stream;


/* انتظار الفيديو */

await new Promise(
function(resolve){

if(video.readyState >= 2){

resolve();

return;

}

video.addEventListener(
"loadeddata",
resolve,
{once:true}
);

}
);


try{

await video.play();

}
catch(error){

console.log(
"video play:",
error
);

}


/* حجم الرسم */

canvas.width =
video.videoWidth || 640;

canvas.height =
video.videoHeight || 480;


/* إظهار الكاميرا */

camera.classList.remove(
"hidden"
);

cameraRunning = true;

startBtn.disabled = false;

startBtn.textContent =
"🟢 الكاميرا تعمل";

statusBox.textContent =
"⏳ جاري تشغيل التعرف على الجسم...";

poseBox.textContent =
"📷 جاري التعرف...";


/* تحميل نموذج الجسم */

const loaded =
await loadPoseModel();


if(!loaded){

return;

}


statusBox.textContent =
"🟢 الكاميرا والتعرف على الجسم يعملان";


poseBox.textContent =
"🧍 أظهر جسمك كاملًا";


lastVideoTime = -1;


/* بدء المراقبة */

startVisualMonitor();

}
catch(error){

console.error(
"Camera error:",
error
);

cameraRunning = false;

startBtn.disabled = false;

startBtn.textContent =
"▶️ بدء المراقبة";


if(error.name === "NotAllowedError"){

showAlert(
"❌ تم رفض إذن الكاميرا. اضغط على رمز القفل بجانب عنوان الموقع ثم اسمح باستخدام الكاميرا.",
"error"
);

}
else if(error.name === "NotFoundError"){

showAlert(
"❌ لم يتم العثور على كاميرا في الجهاز.",
"error"
);

}
else if(error.name === "NotReadableError"){

showAlert(
"❌ الكاميرا مستخدمة من تطبيق آخر. أغلق التطبيقات التي تستخدم الكاميرا ثم حاول مرة أخرى.",
"error"
);

}
else if(error.name === "SecurityError"){

showAlert(
"❌ المتصفح منع الوصول إلى الكاميرا بسبب إعدادات الأمان. افتح الموقع عبر HTTPS.",
"error"
);

}
else{

showAlert(
"❌ لم تعمل الكاميرا. تأكد من السماح للمتصفح باستخدام الكاميرا ثم حاول مرة أخرى.",
"error"
);

}

statusBox.textContent =
"❌ لم تبدأ الكاميرا";

}

}


/* =====================================================
   المراقبة
===================================================== */

function startVisualMonitor(){

if(!cameraRunning){

return;

}


/* التعرف على الجسم */

detectBody();


/* إعادة الإطار */

animationFrame =
requestAnimationFrame(
startVisualMonitor
);

}


/* =====================================================
   التعرف على الجسم
===================================================== */

function detectBody(){

if(
!poseLandmarker ||
!cameraRunning ||
video.readyState < 2
){

return;

}


/* لا نعيد نفس الإطار */

if(
video.currentTime === lastVideoTime
){

return;

}

lastVideoTime =
video.currentTime;


try{

const result =
poseLandmarker.detectForVideo(
video,
performance.now()
);


if(
result &&
result.landmarks &&
result.landmarks.length > 0
){

const landmarks =
result.landmarks[0];


/* رسم الجسم */

drawPose(
landmarks
);


/* تحليل الحركة */

const detected =
classifyPose(
landmarks
);


/* عرض الحركة */

updatePose(
detected
);

}
else{

drawSimpleGuide();

poseBox.textContent =
"👤 لم يتم العثور على الجسم";

statusBox.textContent =
"🟡 أظهر جسمك كاملًا أمام الكاميرا";

}

}
catch(error){

console.log(
"Pose detection:",
error
);

}

}


/* =====================================================
   رسم الهيكل العظمي
===================================================== */

function drawPose(landmarks){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


/* إطار الجسم */

const x =
canvas.width * 0.06;

const y =
canvas.height * 0.03;

const w =
canvas.width * 0.88;

const h =
canvas.height * 0.93;


ctx.setLineDash([10,8]);

ctx.lineWidth = 3;

ctx.strokeStyle =
"rgba(255,255,255,.8)";

ctx.strokeRect(
x,
y,
w,
h
);

ctx.setLineDash([]);


/* خطوط الجسم */

const connections = [

[P.LEFT_SHOULDER,P.RIGHT_SHOULDER],

[P.LEFT_SHOULDER,P.LEFT_ELBOW],
[P.LEFT_ELBOW,P.LEFT_WRIST],

[P.RIGHT_SHOULDER,P.RIGHT_ELBOW],
[P.RIGHT_ELBOW,P.RIGHT_WRIST],

[P.LEFT_SHOULDER,P.LEFT_HIP],
[P.RIGHT_SHOULDER,P.RIGHT_HIP],

[P.LEFT_HIP,P.RIGHT_HIP],

[P.LEFT_HIP,P.LEFT_KNEE],
[P.LEFT_KNEE,P.LEFT_ANKLE],

[P.RIGHT_HIP,P.RIGHT_KNEE],
[P.RIGHT_KNEE,P.RIGHT_ANKLE],

[P.LEFT_ANKLE,P.LEFT_FOOT],
[P.RIGHT_ANKLE,P.RIGHT_FOOT]

];


ctx.lineWidth = 5;

ctx.strokeStyle =
"rgba(30,220,150,.95)";


for(
const connection of connections
){

const a =
landmarks[connection[0]];

const b =
landmarks[connection[1]];


if(!a || !b){

continue;

}


if(
(a.visibility ?? 1) < 0.35 ||
(b.visibility ?? 1) < 0.35
){

continue;

}


ctx.beginPath();

ctx.moveTo(
a.x * canvas.width,
a.y * canvas.height
);

ctx.lineTo(
b.x * canvas.width,
b.y * canvas.height
);

ctx.stroke();

}


/* نقاط الجسم */

for(
const point of landmarks
){

if(
(point.visibility ?? 1) < 0.35
){

continue;

}


ctx.beginPath();

ctx.arc(
point.x * canvas.width,
point.y * canvas.height,
5,
0,
Math.PI * 2
);

ctx.fillStyle =
"rgba(255,255,255,.95)";

ctx.fill();

}

}


/* =====================================================
   دليل الكاميرا
===================================================== */

function drawSimpleGuide(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const x =
canvas.width * 0.10;

const y =
canvas.height * 0.04;

const w =
canvas.width * 0.80;

const h =
canvas.height * 0.90;


ctx.setLineDash(
[12,10]
);

ctx.lineWidth = 4;

ctx.strokeStyle =
"rgba(255,255,255,.9)";

ctx.strokeRect(
x,
y,
w,
h
);

ctx.setLineDash([]);


ctx.beginPath();

ctx.arc(
canvas.width / 2,
canvas.height * 0.50,
5,
0,
Math.PI * 2
);

ctx.fillStyle =
"rgba(255,255,255,.9)";

ctx.fill();

}


/* =====================================================
   أدوات حساب الزوايا
===================================================== */

function distance(a,b){

const dx =
a.x - b.x;

const dy =
a.y - b.y;

return Math.sqrt(
dx * dx + dy * dy
);

}


function angle(a,b,c){

const abx =
a.x - b.x;

const aby =
a.y - b.y;

const cbx =
c.x - b.x;

const cby =
c.y - b.y;


const dot =
abx * cbx +
aby * cby;


const mag1 =
Math.sqrt(
abx * abx +
aby * aby
);

const mag2 =
Math.sqrt(
cbx * cbx +
cby * cby
);


if(
mag1 === 0 ||
mag2 === 0
){

return 180;

}


let value =
dot / (mag1 * mag2);


value =
Math.max(
-1,
Math.min(1,value)
);


return Math.acos(value) *
180 / Math.PI;

}


/* =====================================================
   التعرف على وضعية الجسم
===================================================== */

function classifyPose(l){

const ls =
l[P.LEFT_SHOULDER];

const rs =
l[P.RIGHT_SHOULDER];

const lh =
l[P.LEFT_HIP];

const rh =
l[P.RIGHT_HIP];

const lk =
l[P.LEFT_KNEE];

const rk =
l[P.RIGHT_KNEE];

const la =
l[P.LEFT_ANKLE];

const ra =
l[P.RIGHT_ANKLE];

const nose =
l[P.NOSE];


if(
!ls || !rs ||
!lh || !rh ||
!lk || !rk ||
!la || !ra
){

return "غير واضح";

}


/* منتصف الجسم */

const shoulder = {

x:(ls.x + rs.x) / 2,

y:(ls.y + rs.y) / 2

};


const hip = {

x:(lh.x + rh.x) / 2,

y:(lh.y + rh.y) / 2

};


const knee = {

x:(lk.x + rk.x) / 2,

y:(lk.y + rk.y) / 2

};


const ankle = {

x:(la.x + ra.x) / 2,

y:(la.y + ra.y) / 2

};


/* طول الجسم */

const bodyLength =
distance(
shoulder,
ankle
);


/* حماية */

if(
bodyLength < 0.15
){

return "غير واضح";

}


/* زاوية الركبة */

const leftKneeAngle =
angle(
lh,
lk,
la
);

const rightKneeAngle =
angle(
rh,
rk,
ra
);

const kneeAngle =
(
leftKneeAngle +
rightKneeAngle
) / 2;


/* زاوية الجذع بالنسبة للرأس/الجسم */

const dx =
hip.x - shoulder.x;

const dy =
hip.y - shoulder.y;

const torsoAngle =
Math.atan2(
Math.abs(dx),
Math.abs(dy)
) * 180 / Math.PI;


/* =====================================================
   السجود
   الجسم يكون منخفضًا جدًا وقريبًا من الوضع الأفقي
===================================================== */

const lowBody =
shoulder.y > 0.48 &&
hip.y > 0.50;


const nearlyHorizontal =
Math.abs(
hip.y - shoulder.y
) < 0.28;


if(
lowBody &&
nearlyHorizontal &&
kneeAngle < 145
){

return "🧎 السجود";

}


/* =====================================================
   الجلوس
===================================================== */

const sittingBody =
hip.y > shoulder.y + 0.15;

const sittingKnees =
kneeAngle < 125;


if(
sittingBody &&
sittingKnees
){

return "🪑 الجلوس";

}


/* =====================================================
   الركوع
===================================================== */

const hipsBelowShoulders =
hip.y > shoulder.y + 0.05;

const leaning =
torsoAngle > 32;


if(
hipsBelowShoulders &&
leaning &&
kneeAngle > 135
){

return "🙇 الركوع";

}


/* =====================================================
   القيام
===================================================== */

const upright =
torsoAngle < 25;

const legsMostlyStraight =
kneeAngle > 150;

const shoulderAboveHip =
shoulder.y < hip.y;

const hipAboveKnee =
hip.y < knee.y;


if(
upright &&
legsMostlyStraight &&
shoulderAboveHip &&
hipAboveKnee
){

return "🧍 القيام";

}


/* =====================================================
   وضع غير واضح
===================================================== */

return "👤 وضعية غير واضحة";

}


/* =====================================================
   تحديث الحركة
===================================================== */

function updatePose(name){

if(!name){

return;

}


/* عرض مباشر */

poseBox.textContent =
name;


/* =====================================================
   تثبيت الحركة لعدة إطارات
   حتى لا تتغير النتيجة بسرعة
===================================================== */

if(
name === stablePose
){

stableCount++;

}
else{

stablePose = name;

stableCount = 1;

}


/* نحتاج عدة إطارات متتالية */

if(
stableCount < 8
){

return;

}


/* لا نكرر نفس الحركة */

if(
name === lastPoseName
){

return;

}


/* منع التسجيل السريع جدًا */

const now =
Date.now();

if(
now - lastMovementTime < 1200
){

return;

}


lastMovementTime =
now;

lastPoseName =
name;


/* =====================================================
   تسجيل الحركة
===================================================== */

if(
name.includes("القيام")
){

addMovement("🧍 القيام");

}
else if(
name.includes("الركوع")
){

addMovement("🙇 الركوع");

}
else if(
name.includes("السجود")
){

addMovement("🧎 السجود");

}
else if(
name.includes("الجلوس")
){

addMovement("🪑 الجلوس");

}

}


/* =====================================================
   إضافة حركة إلى التسلسل
===================================================== */

function addMovement(name){

/* لا نضيف وضعية غير واضحة */

if(!name){

return;

}


/* منع التكرار المباشر */

if(
movements.length > 0 &&
movements[
movements.length - 1
] === name
){

return;

}


movements.push(name);


/* =====================================================
   تحديث التسلسل
===================================================== */

sequenceBox.textContent =
movements.join(" → ");


/* =====================================================
   محاولة حساب الركعات
   قيام → ركوع → قيام → سجود → سجود
===================================================== */

checkRakaa();

}


/* =====================================================
   حساب الركعة
===================================================== */

function checkRakaa(){

const n =
movements.length;


if(n < 4){

return;

}


/*
نبحث عن آخر أربع حركات
*/

const a =
movements[n - 4];

const b =
movements[n - 3];

const c =
movements[n - 2];

const d =
movements[n - 1];


/*
نمط تقريبي:

قيام
ركوع
سجود
سجود
*/

if(
a.includes("القيام") &&
b.includes("الركوع") &&
c.includes("السجود") &&
d.includes("السجود")
){

rakaa++;

rakaaBox.textContent =
rakaa;


/* رسالة بسيطة */

statusBox.textContent =
"🟢 تم رصد تسلسل حركات ركعة تقريبًا";

}

}


/* =====================================================
   إيقاف الكاميرا
===================================================== */

stopBtn.addEventListener(
"click",
function(){

stopCamera();

}
);


function stopCamera(){

cameraRunning = false;


/* إيقاف Animation */

if(animationFrame){

cancelAnimationFrame(
animationFrame
);

animationFrame = null;

}


/* إيقاف الكاميرا */

if(stream){

stream
.getTracks()
.forEach(
function(track){

track.stop();

}
);

stream = null;

}


/* إزالة الفيديو */

video.srcObject = null;


/* مسح الرسم */

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


/* إخفاء الكاميرا */

camera.classList.add(
"hidden"
);

permissionBox.classList.add(
"hidden"
);


/* إعادة الزر */

startBtn.disabled = false;

startBtn.textContent =
"▶️ بدء المراقبة";


statusBox.textContent =
"تم إيقاف الكاميرا";

poseBox.textContent =
"—";


lastVideoTime = -1;

}


/* =====================================================
   التنبيه
===================================================== */

function showAlert(
text,
type
){

alertBox.textContent =
text;

alertBox.className =
"notice " + type;

alertBox.classList.remove(
"hidden"
);

}


/* =====================================================
   الصوت
===================================================== */

function speak(text){

if(
!("speechSynthesis" in window)
){

return;

}


try{

window.speechSynthesis.cancel();


const message =
new SpeechSynthesisUtterance(
text
);

message.lang =
"ar-SA";

message.rate =
0.85;

message.pitch =
1;

message.volume =
1;


window.speechSynthesis.speak(
message
);

}
catch(error){

console.log(
"Speech error:",
error
);

}

}


/* =====================================================
   تنظيف عند مغادرة الصفحة
===================================================== */

window.addEventListener(
"beforeunload",
function(){

stopCamera();

}
